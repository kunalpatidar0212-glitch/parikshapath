<style>
:root{
  --navy:#0F2A4E;
  --navy-2:#15335C;
  --navy-3:#0A2140;
  --saffron:#F5901F;
  --saffron-dark:#DC7C0E;
  --saffron-soft:#FFF1DE;
  --bg:#F6F7FA;
  --card:#FFFFFF;
  --text:#16202A;
  --muted:#68758A;
  --border:#E6E9F0;
  --green:#158A4B;
  --green-bg:#E9F8EF;
  --red:#D6402E;
  --red-bg:#FDEEEC;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.display{ font-family:'Manrope',sans-serif; letter-spacing:-0.02em; }
.hi{ font-family:'Noto Sans Devanagari','Inter',sans-serif; }
a{ text-decoration:none; color:inherit; }
button{ font-family:inherit; cursor:pointer; border:none; }
input,select,textarea{ font-family:inherit; }
::selection{ background:var(--saffron-soft); }

/* ---- layout helpers ---- */
.wrap{ max-width:1180px; margin:0 auto; padding:0 28px; }
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:12px 20px; border-radius:10px; font-weight:700; font-size:14.5px;
  transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
}
.btn:active{ transform:translateY(1px); }
.btn-saffron{ background:var(--saffron); color:#221200; box-shadow:0 6px 16px -6px rgba(245,144,31,.55); }
.btn-saffron:hover{ background:var(--saffron-dark); }
.btn-navy{ background:var(--navy); color:#fff; }
.btn-navy:hover{ background:var(--navy-2); }
.btn-outline{ background:#fff; color:var(--navy); border:1.5px solid var(--border); }
.btn-outline:hover{ border-color:var(--navy); }
.btn-ghost{ background:transparent; color:var(--navy); }
.btn-danger{ background:var(--red-bg); color:var(--red); }
.btn-sm{ padding:8px 14px; font-size:13px; border-radius:8px; }
.card{ background:var(--card); border:1px solid var(--border); border-radius:16px; }
.pill{ display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:999px; font-size:12px; font-weight:700; }
.pill-saffron{ background:var(--saffron-soft); color:var(--saffron-dark); }
.pill-navy{ background:#EAF0F9; color:var(--navy); }
.pill-green{ background:var(--green-bg); color:var(--green); }
.field-label{ display:block; font-size:13px; font-weight:700; color:var(--navy); margin-bottom:6px; }
.field{
  width:100%; padding:11px 13px; border:1.5px solid var(--border); border-radius:10px;
  font-size:14.5px; color:var(--text); background:#fff; outline:none;
}
.field:focus{ border-color:var(--saffron); box-shadow:0 0 0 3px rgba(245,144,31,.15); }
.eyebrow{ color:var(--saffron-dark); font-weight:800; font-size:12.5px; letter-spacing:.08em; text-transform:uppercase; }
.muted{ color:var(--muted); }
.divider{ height:1px; background:var(--border); border:none; margin:0; }

/* ---- top navbar ---- */
.navbar{ background:var(--navy); position:sticky; top:0; z-index:40; }
.navbar .wrap{ display:flex; align-items:center; justify-content:space-between; height:70px; }
.brand{ display:flex; align-items:center; gap:10px; color:#fff; font-weight:800; font-size:18px; }
.brand-badge{ width:34px; height:34px; border-radius:9px; background:var(--saffron); display:flex; align-items:center; justify-content:center; font-weight:800; color:#221200; font-size:14px; flex-shrink:0; }
.brand-badge svg{ width:18px; height:18px; }
.navlinks{ display:flex; align-items:center; gap:30px; }
.navlinks a{ color:#C9D4E5; font-size:14.5px; font-weight:600; padding:6px 0; border-bottom:2px solid transparent; }
.navlinks a.active, .navlinks a:hover{ color:#fff; border-color:var(--saffron); }
.nav-right{ display:flex; align-items:center; gap:18px; }
.nav-right .lang{ color:#C9D4E5; font-size:13px; font-weight:700; cursor:pointer; }
.hamburger{ display:none; width:34px; height:34px; border-radius:8px; background:transparent; align-items:center; justify-content:center; color:#fff; font-size:20px; }
.mobile-menu{ display:none; flex-direction:column; background:var(--navy-2); padding:6px 28px 16px; }
.mobile-menu a{ color:#EAF0F9; font-size:15px; font-weight:600; padding:12px 0; border-bottom:1px solid rgba(255,255,255,.08); }
.mobile-menu.open{ display:flex; }
@media(max-width:920px){
  .navlinks, .nav-right .lang, .nav-right > a:not(.hamburger){ display:none; }
  .nav-right{ gap:10px; }
  .hamburger{ display:flex; }
}

/* ---- toast notifications ---- */
#toastRoot{ position:fixed; top:18px; right:18px; z-index:200; display:flex; flex-direction:column; gap:10px; }
.toast-msg{ min-width:240px; max-width:340px; padding:13px 16px; border-radius:10px; font-size:13.5px; font-weight:600; box-shadow:0 12px 28px -8px rgba(10,20,35,.28); animation:toastIn .18s ease; display:flex; align-items:center; gap:9px; }
.toast-msg.ok{ background:#fff; border:1px solid #cdeeda; color:var(--green); }
.toast-msg.err{ background:#fff; border:1px solid #f6cfc7; color:var(--red); }
@keyframes toastIn{ from{ opacity:0; transform:translateY(-8px);} to{ opacity:1; transform:translateY(0);} }

/* ---- footer ---- */
.footer{ background:#fff; border-top:1px solid var(--border); margin-top:80px; }
.footer .wrap{ padding:48px 28px 0; display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr; gap:32px; }
.footer h5{ font-size:12.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--navy); margin:0 0 14px; }
.footer p, .footer a{ font-size:14px; color:var(--muted); line-height:1.7; }
.footer a:hover{ color:var(--saffron-dark); }
.footer-bottom{ text-align:center; padding:22px 0; margin-top:32px; border-top:1px solid var(--border); color:var(--muted); font-size:13px; }
@media(max-width:820px){ .footer .wrap{ grid-template-columns:1fr 1fr; } }

/* ---- hero / sections ---- */
.hero{ background:linear-gradient(180deg,#fff 0%, #FFF8ED 100%); padding:64px 0 30px; }
.hero-grid{ display:grid; grid-template-columns:1.15fr .85fr; gap:44px; align-items:start; }
.hero h1{ font-size:46px; line-height:1.08; margin:18px 0 16px; font-weight:800; }
.hero h1 .accent{ color:var(--saffron); }
.hero-badge{ display:inline-flex; gap:8px; align-items:center; background:#fff; border:1px solid var(--border); padding:7px 14px 7px 10px; border-radius:999px; font-size:13px; font-weight:700; color:var(--navy); }
.hero p.lead{ font-size:16.5px; color:var(--muted); line-height:1.7; max-width:520px; }
.trust-row{ display:flex; gap:22px; margin-top:20px; flex-wrap:wrap; }
.trust-row span{ display:flex; align-items:center; gap:7px; font-size:13.5px; font-weight:600; color:var(--navy); }
.check{ width:18px; height:18px; border-radius:50%; background:var(--green-bg); color:var(--green); display:inline-flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; }
.waitlist-card{ padding:26px; }
.section{ padding:60px 0; }
.section-head{ max-width:640px; margin-bottom:36px; }
.section-head h2{ font-size:32px; margin:10px 0 12px; }
.feature-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }
.feature-card{ padding:24px; }
.feature-icon{ width:42px; height:42px; border-radius:11px; background:var(--saffron-soft); color:var(--saffron-dark); display:flex; align-items:center; justify-content:center; font-size:19px; margin-bottom:14px; }
@media(max-width:900px){ .hero-grid,.feature-grid{ grid-template-columns:1fr; } }

/* ---- pricing ---- */
.pricing-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:22px; }
.price-card{ padding:28px; position:relative; }
.price-card.popular{ border-color:var(--saffron); box-shadow:0 18px 40px -18px rgba(245,144,31,.4); }
.price-amt{ font-size:38px; font-weight:800; margin:10px 0 2px; }
.price-list{ list-style:none; padding:0; margin:20px 0 24px; display:flex; flex-direction:column; gap:11px; }
.price-list li{ display:flex; gap:9px; align-items:flex-start; font-size:14px; color:var(--text); }
@media(max-width:900px){ .pricing-grid{ grid-template-columns:1fr; } }

/* ---- faq ---- */
.faq-item{ border-bottom:1px solid var(--border); padding:20px 0; cursor:pointer; }
.faq-q{ display:flex; justify-content:space-between; align-items:center; font-weight:700; font-size:15.5px; }
.faq-a{ max-height:0; overflow:hidden; transition:max-height .2s ease; color:var(--muted); font-size:14.5px; line-height:1.7; }
.faq-item.open .faq-a{ max-height:220px; padding-top:12px; }
.faq-item.open .chev{ transform:rotate(180deg); }
.chev{ transition:transform .2s ease; }

/* ---- auth ---- */
.auth-wrap{ min-height:calc(100vh - 70px - 260px); display:flex; align-items:center; justify-content:center; padding:60px 20px; }
.auth-card{ width:420px; padding:32px; }
.role-toggle{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px; }
.role-opt{ border:1.5px solid var(--border); border-radius:10px; padding:14px; cursor:pointer; }
.role-opt.selected{ border-color:var(--saffron); background:var(--saffron-soft); }
.role-opt b{ display:block; font-size:14.5px; }
.role-opt span{ font-size:12px; color:var(--muted); }

/* ---- app shell ---- */
.app-shell{ display:grid; grid-template-columns:238px 1fr; min-height:100vh; }
.sidebar{ background:var(--navy); color:#fff; padding:20px 14px; display:flex; flex-direction:column; }
.sidebar .brand{ padding:6px 10px 22px; }
.side-link{ display:flex; align-items:center; gap:11px; padding:11px 13px; border-radius:10px; font-size:14px; font-weight:600; color:#B9C6DC; margin-bottom:3px; }
.side-link .ic{ width:18px; text-align:center; }
.side-link.active{ background:var(--saffron); color:#221200; }
.side-link:hover:not(.active){ background:var(--navy-2); color:#fff; }
.side-foot{ margin-top:auto; padding:12px; border-top:1px solid rgba(255,255,255,.12); font-size:12.5px; color:#B9C6DC; }
.side-foot b{ display:block; color:#fff; font-size:13.5px; }
.app-main{ padding:0; }
.app-top{ background:#fff; border-bottom:1px solid var(--border); padding:16px 30px; display:flex; justify-content:space-between; align-items:center; }
.app-body{ padding:28px 30px 60px; }
.kpi-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin:22px 0; }
.kpi-card{ padding:20px; }
.kpi-num{ font-size:30px; font-weight:800; margin-top:8px; }
.toast{ background:var(--green-bg); color:var(--green); border:1px solid #cdeeda; padding:12px 16px; border-radius:10px; font-size:13.5px; font-weight:700; display:inline-flex; align-items:center; gap:8px; margin-bottom:18px; }
@media(max-width:820px){ .app-shell{ grid-template-columns:74px 1fr; } .sidebar .side-link span.lbl, .sidebar .brand span{ display:none; } .kpi-grid{ grid-template-columns:1fr; } }

/* ---- misc components ---- */
.tabs{ display:inline-flex; background:#EEF1F6; border-radius:10px; padding:4px; gap:2px; }
.tab-btn{ padding:8px 16px; border-radius:8px; font-size:13.5px; font-weight:700; color:var(--muted); background:transparent; }
.tab-btn.active{ background:#fff; color:var(--navy); box-shadow:0 1px 3px rgba(0,0,0,.08); }
.list-row{ display:flex; justify-content:space-between; align-items:center; padding:16px 18px; border:1px solid var(--border); border-radius:12px; margin-bottom:12px; background:#fff; }
.modal-bg{ position:fixed; inset:0; background:rgba(10,20,35,.55); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; }
.modal{ width:480px; max-width:100%; padding:26px; }
.opt-row{ display:flex; align-items:center; gap:12px; padding:14px 16px; border:1.5px solid var(--border); border-radius:12px; margin-bottom:10px; }
.opt-row.correct{ border-color:var(--green); background:var(--green-bg); }
.opt-row.picked{ border-color:var(--saffron); background:var(--saffron-soft); }
.opt-letter{ width:28px; height:28px; border-radius:50%; background:#EEF1F6; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12.5px; flex-shrink:0; }
.opt-row.correct .opt-letter{ background:var(--green); color:#fff; }
.opt-row.picked .opt-letter{ background:var(--saffron); color:#221200; }
.nav-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
.qnum{ width:100%; aspect-ratio:1; border-radius:8px; border:1.5px solid var(--border); background:#fff; font-weight:700; font-size:13px; }
.qnum.answered{ background:var(--navy); color:#fff; border-color:var(--navy); }
.qnum.current{ border-color:var(--saffron); box-shadow:0 0 0 3px rgba(245,144,31,.2); }
.chat-shell{ display:grid; grid-template-columns:280px 1fr; height:520px; border:1px solid var(--border); border-radius:16px; overflow:hidden; background:#fff; }
.conv-item{ padding:14px 16px; border-bottom:1px solid var(--border); cursor:pointer; }
.conv-item.active{ background:var(--saffron-soft); }
.bubble{ max-width:70%; padding:10px 14px; border-radius:12px; font-size:14px; margin-bottom:10px; }
.bubble.mine{ background:var(--navy); color:#fff; margin-left:auto; border-bottom-right-radius:3px; }
.bubble.theirs{ background:#EEF1F6; margin-right:auto; border-bottom-left-radius:3px; }
table.leads{ width:100%; border-collapse:collapse; }
table.leads th{ text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); padding:10px 14px; border-bottom:1px solid var(--border); }
table.leads td{ padding:13px 14px; border-bottom:1px solid var(--border); font-size:14px; }
.chip{ display:inline-block; padding:5px 11px; border-radius:8px; background:var(--saffron-soft); color:var(--saffron-dark); font-size:12.5px; font-weight:700; }
</style>
</head>

      <button class="btn btn-outline" onclick="saveDraft(false)">Save draft</button>

function renderQuestions(t){
  return t.questions.map((q,i)=>`
    <div class="card" style="padding:20px;margin-bottom:14px;">
      <div style="display:flex;justify-content:space-between;"><b>Q${i+1}</b><span onclick="removeQuestion(${i})" style="cursor:pointer;color:var(--red);">&#128465;</span></div>
      <textarea class="field" style="margin:10px 0 8px;min-height:44px;" oninput="draftTest.questions[${i}].en=this.value">${q.en}</textarea>
      <textarea class="field hi" style="margin-bottom:12px;min-height:44px;" oninput="draftTest.questions[${i}].hi=this.value">${q.hi}</textarea>
      ${q.opts.map((o,oi)=>`
        <div class="opt-row" style="align-items:center;">
          <input type="radio" name="correct${i}" ${q.correct===oi?'checked':''} onchange="draftTest.questions[${i}].correct=${oi}">
          <input class="field" style="flex:1;" value="${o.en}" oninput="draftTest.questions[${i}].opts[${oi}].en=this.value">
          <input class="field hi" style="flex:1;" value="${o.hi}" oninput="draftTest.questions[${i}].opts[${oi}].hi=this.value">
        </div>`).join('')}
    </div>`).join('');
}
function removeQuestion(i){ draftTest.questions.splice(i,1); document.getElementById('qList').innerHTML = renderQuestions(draftTest); }
function aiGenerate(){
  const topic = document.getElementById('aiTopic').value || (draftTest.examType==='academic' ? `${draftTest.sub} Class/Sem ${draftTest.classSem}` : 'General Studies');
  const n = +document.getElementById('aiCount').value || 1;
  for(let i=0;i<n;i++){
    draftTest.questions.push({
      en:`[AI draft] Sample question on ${topic} (#${draftTest.questions.length+1}) — edit before publishing.`,
      hi:`[एआई ड्राफ्ट] ${topic} पर नमूना प्रश्न — प्रकाशित करने से पहले संपादित करें।`,
      opts:[{en:'Option A',hi:'विकल्प अ'},{en:'Option B',hi:'विकल्प ब'},{en:'Option C',hi:'विकल्प स'},{en:'Option D',hi:'विकल्प द'}],
      correct:0, explanation:''
    });
  }
  document.getElementById('qList').innerHTML = renderQuestions(draftTest);
  setToast(`${n} AI-drafted question(s) appended — review before publishing.`);
}
function saveDraft(publish){
  draftTest.published = publish;
  const idx = S.tests.findIndex(x=>x.id===draftTest.id);
  if(idx>-1) S.tests[idx] = draftTest; else S.tests.push(draftTest);
  setToast(publish? 'Test published.' : 'Draft saved.');
  go('#/teacher/tests');
}

function gradeSubjective(id){
  const s = S.submissions.find(x=>x.id===id);
  const marksVal = document.getElementById('marks_'+id).value;

  s.teacherMarks = +marksVal; s.teacherFeedback = fbVal; s.graded = true;
  S.notifications.unshift({type:'result', text:`Marks posted for your subjective submission`});
  setToast('Marks posted to student.');
  render();
}

function testMatchesLevel(t, level){
  if(level==='All') return true;
  if(level==='Competitive') return t.category==='RPSC' || t.category==='RSSB';
  if(level==='School') return t.category==='School';
  if(level==='College') return t.category==='College';
  return true;
}
function renderCatalogCards(){
  const q = catalogFilter.q.toLowerCase();
  const list = S.tests.filter(t=>t.published)
    .filter(t=>testMatchesLevel(t, catalogFilter.level))
    .filter(t=>catalogFilter.board==='All' || t.sub===catalogFilter.board)
    .filter(t=>catalogFilter.tier==='All' || t.tier===catalogFilter.tier)
    .filter(t=>!q || t.title.toLowerCase().includes(q) || (t.sub||'').toLowerCase().includes(q));
  if(!list.length) return `<p class="muted">No tests match these filters.</p>`;

function startAttempt(testId){
  const t = S.tests.find(x=>x.id===testId);
  if(t.type==='subjective'){
    S.attempt = { testId, subjective:true, fileName:null, secondsLeft:t.duration*60 };
    go('#/student/attempt');
    return;
  }
  S.attempt = { testId, answers:new Array(t.questions.length).fill(null), bookmarked:new Array(t.questions.length).fill(false), current:0, secondsLeft:t.duration*60 };
  go('#/student/attempt');
}
function pickSubjectiveFile(input){
  const f = input.files && input.files[0];
  if(!f) return;
  if(f.size > 5*1024*1024){ setToast('File is larger than 5 MB — please upload a smaller PDF.', true); input.value=''; return; }
  if(f.type !== 'application/pdf' && !f.name.toLowerCase().endsWith('.pdf')){ setToast('Only PDF files are accepted.', true); input.value=''; return; }
  S.attempt.fileName = f.name;
  S.attempt.fileSize = f.size;
  render();
}
function submitSubjective(){

}

function fmtTime(s){ const m=Math.floor(s/60); const sec=s%60; return `${m}:${sec.toString().padStart(2,'0')}`; }
function pickAnswer(oi){ S.attempt.answers[S.attempt.current]=oi; render(); }
function toggleBookmark(){ S.attempt.bookmarked[S.attempt.current]=!S.attempt.bookmarked[S.attempt.current]; render(); }
function attemptNav(d){ S.attempt.current+=d; render(); }
function jumpTo(i){ S.attempt.current=i; render(); }
function submitTest(){
  const t = S.tests.find(x=>x.id===S.attempt.testId);
  const negOn = t.negOn===undefined ? true : t.negOn;
  const blankCutoff = t.blankCutoff===undefined ? 10 : t.blankCutoff;
  let correct=0,wrong=0,blank=0,marks=0;
  t.questions.forEach((q,i)=>{
    const a = S.attempt.answers[i];
    if(a==null){ blank++; }
    else if(a===q.correct){ correct++; marks+=t.marksPerQ; }
    else { wrong++; if(negOn) marks-=t.marksPerQ*t.negRatio; }
  });
  const blankPct = Math.round((blank/t.questions.length)*10000)/100;
  const disqualified = negOn && blankPct>blankCutoff;
  const acc = Math.round((correct/t.questions.length)*10000)/100;
  const sub = {
    id:uid(), testId:t.id, student:S.student.name, date:new Date().toLocaleString('en-IN'),
    answers:S.attempt.answers.slice(), score: disqualified? 0 : Math.round(marks*100)/100, accuracy:acc, correct, wrong, blank, blankPct, disqualified,
    timeTaken: fmtTime(t.duration*60 - S.attempt.secondsLeft),
    aiSummary: disqualified
      ? `Disqualified: ${blankPct}% of questions were left blank, exceeding the ${blankCutoff}% board limit for this test. No marks are awarded — attempt every question, even a guess, to avoid disqualification.`
      : (correct===t.questions.length
        ? "Excellent work — the student answered every question correctly, showing strong command of the topic."
        : "The student demonstrates a reasonable grasp of the core topic but should revisit the questions marked wrong to close specific factual gaps."),
    weak: (!disqualified && wrong>0) ? ["Topic accuracy under time pressure","Factual precision on state-specific facts"] : []
  };
  S.submissions.unshift(sub);
  S.notifications.unshift({type:'result', text:`Result ready: ${t.title}`});
  S.attempt = null;
  go('#/student/result/'+sub.id);
}

function render(){
  const h = location.hash || '#/';
  let html = '';
  const parts = h.replace('#/','').split('/').filter(Boolean);

  if(h==='#/'||h===''){ html = pageHome(); }
  else if(h==='#/about'){ html = pageAbout(); }
  else if(h==='#/pricing'){ html = pagePricing(); }
  else if(h==='#/faq'){ html = pageFaq(); }
  else if(h==='#/contact'){ html = pageContact(); }
  else if(h==='#/login'){ html = pageLogin(); }
  else if(h==='#/signup'){ html = pageSignup(); }
  else if(h==='#/admin'){ html = pageAdmin(); }
  else if(h==='#/teacher/overview'){ html = pageTeacherOverview(); }
  else if(h==='#/teacher/students'){ html = pageTeacherStudents(); }
  else if(h==='#/teacher/tests'){ html = pageTeacherTests(); }
  else if(h==='#/teacher/tests/new'){ html = pageTestEditor('new'); }
  else if(parts[0]==='teacher' && parts[1]==='tests' && parts[3]==='edit'){ html = pageTestEditor(parts[2]); }
  else if(parts[0]==='teacher' && parts[1]==='tests' && parts[3]==='submissions'){ html = pageTeacherSubmissions(parts[2]); }
  else if(h==='#/teacher/chat'){ html = pageTeacherChat(); }
  else if(h==='#/student/overview'){ html = pageStudentOverview(); }
  else if(h==='#/student/catalog'){ html = pageStudentCatalog(); }
  else if(h==='#/student/attempt'){ html = pageStudentAttempt(); }
  else if(h==='#/student/myattempts'){ html = pageStudentMyAttempts(); }
  else if(parts[0]==='student' && parts[1]==='result'){ html = pageStudentResult(parts[2]); }
  else if(h==='#/student/chat'){ html = pageStudentChat(); }
  else if(h==='#/student/notifications'){ html = pageStudentNotifications(); }
  else { html = pageHome(); }

  document.getElementById('app').innerHTML = html;
  closeMobileMenu();
  startAttemptTimerIfNeeded();
}

function startAttemptTimerIfNeeded(){
  if(attemptTimer){ clearInterval(attemptTimer); attemptTimer=null; }
  if(location.hash==='#/student/attempt' && S.attempt){
    attemptTimer = setInterval(()=>{
      if(!S.attempt) { clearInterval(attemptTimer); return; }
      S.attempt.secondsLeft--;
      const pill = document.getElementById('timerPill');
      if(pill) pill.innerHTML = '&#9201; '+fmtTime(Math.max(S.attempt.secondsLeft,0));
      if(S.attempt.secondsLeft<=0){
        clearInterval(attemptTimer);
        if(S.attempt.subjective){
          if(S.attempt.fileName){ submitSubjective(); } else { S.attempt=null; setToast('Time is up — no answer sheet was uploaded.', true); render(); }
        } else { submitTest(); }
      }
    },1000);
  }
}

onRoute();
</script>
</body>
</html>
